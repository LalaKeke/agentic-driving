name: CorDriver open-loop replay
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  frozen-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source syntax
        run: python -m compileall -q implementation
      - name: Replay frozen dispatch and verify cohort metrics
        run: |
          python -B implementation/evaluation/review.py dispatch
          python -B implementation/evaluation/review.py metrics
